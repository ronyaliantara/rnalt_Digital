<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertempuran Laut — Kuis Strategi Armada untuk 2–4 Tim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%93%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-core.css?v=20261118k">
  <link rel="stylesheet" href="style.css?v=20261118k">
</head>
<body>
  <div class="app" id="app">
    <div class="sea" aria-hidden="true">
      <div class="wave w1"></div>
      <div class="wave w2"></div>
      <div class="deco" id="deco"></div>
    </div>
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">⚓</div>
        <div>
          <h1>PERTEMPURAN <span>LAUT</span></h1>
          <p>KUIS STRATEGI ARMADA NUSANTARA</p>
        </div>
      </div>
      <div class="mission">
        <div class="m-item"><small>RONDE</small><b><span id="roundNo">1</span><em id="roundMax"></em></b></div>
        <div class="m-item"><small id="clockLbl">WAKTU</small><b id="clockNo">00:00</b></div>
        <div class="m-item"><small>ARMADA</small><b id="aliveNo">0</b></div>
      </div>
      <nav class="tools">
        <button class="tbtn" data-qc="sound" title="Suara"></button>
        <button class="tbtn" data-qc="fullscreen" title="Layar penuh">⛶</button>
        <button class="tbtn" id="btnRules" title="Peraturan">📜</button>
        <button class="tbtn" id="btnSetup" title="Pengaturan / ubah tim">⚙️</button>
        <button class="tbtn wide guru" data-qc="teacher" title="Mode Guru (kelola soal)">🔐<span>Guru</span></button>
      </nav>
    </header>

    <main class="stage" id="stage">
      <div class="tabs" id="tabs" hidden></div>
      <div class="boards" id="boards"></div>
      <div class="cpop" id="cpop" hidden></div>
      <div class="stamp" id="stamp" hidden></div>
      <div class="brief" id="brief" hidden></div>
    </main>

    <footer class="cmd" id="cmd">
      <div class="turnchip" id="turnChip"></div>
      <div class="hint" id="hint" role="status" aria-live="polite"></div>
      <div class="acts" id="acts"></div>
    </footer>
  </div>
  <div class="pl-fx" id="fx" aria-hidden="true"></div>

<script src="questions-default.js?v=20261118k"></script>
<script src="quiz-core.js?v=20261118k"></script>
<script src="game.js?v=20261118k"></script>
<script src="../lokamain-license.js?v=20261118k"></script>
</body>
</html>
