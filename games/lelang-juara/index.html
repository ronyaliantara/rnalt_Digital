<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lelang Juara — Kuis Lelang Seru untuk 2–4 Tim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A8%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-core.css?v=20261118s">
  <link rel="stylesheet" href="style.css?v=20261118s">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">🔨</div>
        <div>
          <h1>LELANG <span>JUARA</span></h1>
          <p>BALAI LELANG KUIS</p>
        </div>
      </div>
      <div class="mission">
        <div class="m-item"><small id="lotLbl">LOT</small><b><span id="lotNo">1</span><em id="lotMax">/12</em></b></div>
        <div class="m-item"><small>WAKTU</small><b id="clockNo">00:00</b></div>
        <div class="m-item jp" id="jpBox"><small>💰 JACKPOT</small><b id="jpNo">0</b></div>
      </div>
      <nav class="tools">
        <button class="tbtn" data-qc="sound" title="Suara"></button>
        <button class="tbtn" data-qc="fullscreen" title="Layar penuh">⛶</button>
        <button class="tbtn" id="btnRules" title="Peraturan">📜</button>
        <button class="tbtn" id="btnSetup" title="Pengaturan / ubah tim">⚙️</button>
        <button class="tbtn wide guru" data-qc="teacher" title="Mode Guru (kelola soal)">🔐<span>Guru</span></button>
      </nav>
    </header>

    <main class="hall" id="hall">
      <div class="curtain left" aria-hidden="true"></div>
      <div class="curtain right" aria-hidden="true"></div>
      <div class="valance" aria-hidden="true"></div>
      <div class="spot" aria-hidden="true"></div>

      <section class="stage" id="stage">
        <div class="lotzone" id="lotZone">
          <div class="tagwrap" id="tagWrap">
            <span class="string" aria-hidden="true"></span>
            <div class="tag" id="tag"></div>
          </div>
        </div>
        <div class="auctioneer" id="auctioneer">
          <div class="call" id="call" role="status" aria-live="polite">Selamat datang di Balai Lelang!</div>
          <div class="bidbox" id="bidBox">
            <small id="bidLbl">TAWARAN TERTINGGI</small>
            <b id="bidNo">—</b>
            <span class="bidwho" id="bidWho"></span>
          </div>
          <div class="cdbar" id="cdBar"><i id="cdFill"></i><span id="cdNum"></span></div>
          <div class="gavelzone">
            <button class="gavel-btn" id="btnHammer" title="Ketuk palu (Spasi)">
              <span class="gavel" id="gavel" aria-hidden="true"><i class="g-handle"></i><i class="g-head"><i class="g-band"></i><i class="g-band b2"></i></i></span>
              <span class="block" id="block" aria-hidden="true"></span>
              <span class="gv-lbl" id="hammerLbl">🔨 Ketuk Palu <kbd>Spasi</kbd></span>
            </button>
          </div>
        </div>
        <div class="finalq" id="finalQ" hidden></div>
        <div class="stamp" id="stamp" hidden></div>
        <div class="mystery" id="mystery" hidden></div>
      </section>

      <section class="pads" id="pads"></section>
    </main>
  </div>
  <div class="brief" id="brief" hidden></div>

<script src="questions-default.js?v=20261118s"></script>
<script src="quiz-core.js?v=20261118s"></script>
<script src="game.js?v=20261118s"></script>
<script src="../lokamain-license.js?v=20261118s"></script>
</body>
</html>
