<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pacu Jalur — Kuis Dayung Berirama 2–4 Tim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230e7490' stroke='%23062a33' stroke-width='4'/%3E%3Cpath d='M8 38 Q32 48 56 34 L52 32 Q32 41 12 35 Z' fill='%23f59e0b' stroke='%23062a33' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M56 34 q4 -10 -2 -14' stroke='%23f59e0b' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M20 22 l6 18 M32 20 l6 20 M44 20 l4 16' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-core.css?v=20261120a">
  <link rel="stylesheet" href="style.css?v=20261120a">
</head>
<body>
  <main class="game" id="game">
    <canvas id="cv"></canvas>

    <!-- HUD atas: kartu tim + ronde + tombol -->
    <header class="top">
      <div class="teams" id="teams"></div>
      <div class="mid">
        <span class="round" id="round">RONDE 0/8</span>
        <nav class="tools">
          <button class="tool" data-qc="sound" title="Suara"></button>
          <button class="tool" data-qc="fullscreen" title="Layar penuh">⛶</button>
          <button class="tool" id="btnRules" title="Peraturan">📜</button>
          <button class="tool" id="btnSetup" title="Pengaturan / ganti tim">⚙️</button>
          <button class="tool guru" data-qc="teacher" title="Mode Guru (kelola soal)">🔐</button>
        </nav>
      </div>
    </header>

    <!-- Papan soal -->
    <section class="board" id="board" hidden>
      <div class="b-top">
        <span class="b-no" id="bNo">SOAL 1</span>
        <span class="b-cat" id="bCat"></span>
        <span class="b-time" id="bTime">15</span>
      </div>
      <div class="b-q" id="bQ"></div>
      <div class="b-opts" id="bOpts"></div>
      <div class="b-st" id="bSt"></div>
      <div class="b-res" id="bRes" hidden></div>
      <div class="b-bar"><i id="bBar"></i></div>
    </section>

    <!-- Gendang (babak dayung) -->
    <div class="drum" id="drum" hidden>
      <div class="drum-ring" id="drumRing"></div>
      <div class="drum-face" id="drumFace">🥁</div>
      <div class="drum-label" id="drumLabel">IKUTI IRAMA!</div>
    </div>

    <!-- Pad tiap tim -->
    <section class="pads" id="pads"></section>

    <!-- Kartu tengah: mulai / hitung mundur / jeda -->
    <div class="center" id="msg" hidden>
      <div class="card">
        <h2 id="msgTitle"></h2>
        <div id="msgSub"></div>
        <button class="go" id="btnGo">MULAI <small>Spasi</small></button>
      </div>
    </div>
  </main>
  <script src="questions-default.js?v=20261120a"></script>
  <script src="quiz-core.js?v=20261120a"></script>
  <script src="game.js?v=20261120a"></script>
  <script src="../lokamain-license.js?v=20261120a"></script>
</body>
</html>
